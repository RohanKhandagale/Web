services:
  - type: web
    name: shravani-construction
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/enquiries.db
    disk:
      name: shravani-data
      mountPath: /var/data
      sizeGB: 1
